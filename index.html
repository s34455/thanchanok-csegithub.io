<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแนะนำตัว - ธัญชนก ผ่องแผ้ว</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background-color: #FFFDE7; color: #333; text-align: center; padding: 40px 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: white; border-radius: 30px; box-shadow: 0 8px 25px rgba(255, 193, 7, 0.2); max-width: 520px; width: 100%; padding: 40px 30px; border: 2px solid #FFE082; }
        
        /* ปรับขนาดกรอบรูปให้พอดีกับรูป tkface.jpg (สเกลประมาณ 3:4) */
        .profile-frame {
            width: 100%;
            max-width: 240px;
            aspect-ratio: 3 / 4;
            margin: 0 auto 25px auto;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #FFC107;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.3);
            background-color: #FFF8E1;
        }
        .profile-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        h1 { color: #37474F; font-size: 2rem; margin-bottom: 12px; }
        p { font-size: 1.05rem; line-height: 1.7; margin-bottom: 25px; color: #455A64; }
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .btn { display: block; padding: 12px 24px; text-decoration: none; border-radius: 50px; font-weight: 600; font-size: 1rem; transition: all 0.3s ease; }
        .btn-primary { background: #FFC107; color: #212121; box-shadow: 0 4px 12px rgba(255, 193, 7, 0.4); }
        .btn-primary:hover { background: #FFB300; transform: translateY(-2px); }
        .btn-secondary { background: #FFF8E1; color: #F57F17; border: 1px solid #FFE082; }
        .btn-secondary:hover { background: #FFECB3; }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-frame">
            <img src="tkface.jpg" alt="ธัญชนก ผ่องแผ้ว" class="profile-img">
        </div>

        <h1>ยินดีต้อนรับสู่ PORTFOLIO</h1>
        <p>
            สวัสดีค่ะ ดิฉันชื่อ <strong>นางสาว ธัญชนก ผ่องแผ้ว (เทส)</strong><br>
            กำลังศึกษาอยู่ ณ โรงเรียนบ้านบึง "อุตสาหกรรมนุเคราะห์"<br>
            เป้าหมาย: <strong>คณะมนุษยศาสตร์และสังคมศาสตร์ สาขาจิตวิทยา<br>มหาวิทยาลัยบูรพา</strong>
        </p>

        <div class="btn-group">
            <a href="intro.html" class="btn btn-primary">เริ่มต้นอ่านคำนำ →</a>
            <a href="about.html" class="btn btn-secondary">ประวัติส่วนตัวและความถนัด</a>
            <a href="portfolio.html" class="btn btn-secondary">ผลงานและเกียรติบัตร</a>
            <a href="thankyou.html" class="btn btn-secondary">หน้าปิดท้าย</a>
        </div>
    </div>

</body>
</html>
